
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Shopping Size Chart</title>
    <style>
        table {
            border-collapse: collapse;
            width: 550px;
        }

        th, td {
            border: 1px solid black;
            padding: 4px;
            text-align: left;
        }

        thead {
            background-color: #c05050;
            color: white;
        }

        tbody tr:nth-child(1) {
            background-color: #e6a0a0;
        }

        tbody tr:nth-child(2) {
            background-color: #f2dada;
        }

        tbody tr:nth-child(3) {
            background-color: #d9d9d9;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Part</th>
                <th>XS</th>
                <th>S</th>
                <th>M</th>
                <th>L</th>
                <th>XL</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Waist</td>
                <td>25</td>
                <td>28</td>
                <td>30</td>
                <td>31</td>
                <td>32</td>
            </tr>
            <tr>
                <td>Chest</td>
                <td>34</td>
                <td>34</td>
                <td>38</td>
                <td>40</td>
                <td>41</td>
            </tr>
            <tr>
                <td>Sleeve</td>
                <td>23</td>
                <td>24</td>
                <td>24</td>
                <td>25</td>
                <td>25</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
